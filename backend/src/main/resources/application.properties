spring.application.name=worksure

server.port=5000

spring.datasource.url=jdbc:mysql://localhost:3306/worksure-aoop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.serialization.write-dates-as-timestamps=false

app.frontend-url=http://localhost:5173
app.api-public-url=http://localhost:5000
app.jwt-secret=${JWT_SECRET:change-me}
app.jwt-expires-ms=604800000
app.platform-commission-rate=0.2
app.upload-dir=uploads
app.seed-on-start=true
app.socketio.port=9092

stripe.secret-key=
stripe.publishable-key=
stripe.webhook-secret=
stripe.currency=usd
stripe.bdt-per-usd=110
